<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#2F80ED" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- 2×2 grid / 4 squares, each 8×8 rx=1.5, 1px gap between -->
  <rect x="3" y="3" width="8" height="8" rx="1.5"/>
  <rect x="13" y="3" width="8" height="8" rx="1.5"/>
  <rect x="3" y="13" width="8" height="8" rx="1.5"/>
  <rect x="13" y="13" width="8" height="8" rx="1.5"/>
</svg>
